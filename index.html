<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Nota is a calm, private notepad that works offline. Your notes never leave your device." />
    <meta name="theme-color" content="#FAF9F6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Nota - a calm place to write</title>
    <script>
      // Apply saved appearance before first paint to avoid a theme flash.
      try {
        var s = JSON.parse(localStorage.getItem('nota:settings') || '{}');
        var r = document.documentElement;
        if (s.theme === 'light' || s.theme === 'dark') r.setAttribute('data-theme', s.theme);
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="./assets/index-DV-HJJVs.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DvLOUL_N.css">
  <link rel="manifest" href="./manifest.webmanifest"></head>
  <body>
    <div id="root"></div>
    <noscript>Nota needs JavaScript to run.</noscript>
  </body>
</html>
